# =============================================================================
# HYP Backend API - Test Configuration
# =============================================================================

# Core Application Configuration
spring.application.name=hyp-backend-test
spring.profiles.active=test

# Disable circular references warning in tests
spring.main.allow-circular-references=true

# MongoDB Test Configuration (use embedded or testcontainers in real setup)
spring.data.mongodb.uri=mongodb://localhost:27017/hyp_test_db

# Redis Test Configuration (use embedded or testcontainers in real setup)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT Test Configuration
jwt.secret=test-secret-key-for-security-integration-tests-must-be-256-bits-long
jwt.access-token.expiration=1800000
jwt.refresh-token.expiration=2592000000
jwt.issuer=hyp-backend-api-test

# Disable rate limiting in tests
rate-limit.enabled=false

# Security Configuration
security.restaurant-scoping.enabled=true
security.restaurant-scoping.strict=false
security.webhook.timestamp-tolerance=300000

# Disable external service calls in tests
sms.enabled=false
onesignal.enabled=false
notification.enabled=false

# Logging - reduce noise in tests
logging.level.org.springframework.security=DEBUG
logging.level.com.hyp.security=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.mongodb=WARN

# CORS - allow all in tests
cors.allowed.origins=*
