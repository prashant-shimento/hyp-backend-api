# =============================================================================
# HYP Backend API - Application Properties
# =============================================================================

env=${ENV}
# -----------------------------------------------------------------------------
# Core Application Configuration
# -----------------------------------------------------------------------------
spring.application.name=hyp-backend
spring.profiles.active=${ENV:production}
spring.config.import=optional:file:.env[.properties]
spring.main.allow-circular-references=true

# -----------------------------------------------------------------------------
# Server Configuration
# -----------------------------------------------------------------------------
server.servlet.context-path=/api/v2

# -----------------------------------------------------------------------------
# SpringDoc OpenAPI Configuration
# -----------------------------------------------------------------------------
springdoc.api-docs.path=/api-docs

# -----------------------------------------------------------------------------
# MongoDB Configuration
# -----------------------------------------------------------------------------
spring.data.mongodb.uri=mongodb+srv://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@${MONGODB_CLUSTER}/${MONGODB_DATABASE}

# -----------------------------------------------------------------------------
# Redis Cache Configuration
# -----------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# -----------------------------------------------------------------------------
# Mail Configuration
# -----------------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hyperappschennai@gmail.com
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# -----------------------------------------------------------------------------
# Actuator Endpoints Configuration
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=always

# -----------------------------------------------------------------------------
# Prometheus Metrics Configuration
# -----------------------------------------------------------------------------
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=hyp-backend
management.metrics.tags.env=${spring.profiles.active}
metrics.aspect.enabled=true

# HTTP request metrics distribution
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.75,0.95,0.99
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,5s

# MongoDB metrics
management.metrics.mongo.command.enabled=true
management.metrics.mongo.connectionpool.enabled=true

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
logging.pattern.level=%5p [${spring.application.name:},%X{request_id:-}]
logging.level.com.hyp.config.LoggingFilterConfig=DEBUG

# -----------------------------------------------------------------------------
# CORS Configuration
# -----------------------------------------------------------------------------
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}
cors.server-ips=178.16.137.243,157.173.219.155,82.29.161.43

# -----------------------------------------------------------------------------
# Application Custom Properties
# -----------------------------------------------------------------------------
app.domain=${APP_DOMAIN}
app.secret.key=${APP_SECRET_KEY}
internal.users.numbers=9965861660

# -----------------------------------------------------------------------------
# PetPooja POS Integration
# -----------------------------------------------------------------------------
pos.petpooja.url=${POS_PETPOOJA_URL}
pos.petpooja.token=${POS_PETPOOJA_TOKEN}
pos.petpooja.secret=${POS_PETPOOJA_SECRET}
pos.petpooja.key=${POS_PETPOOJA_KEY}

# -----------------------------------------------------------------------------
# RazorPay Payment Integration
# -----------------------------------------------------------------------------
razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}

# -----------------------------------------------------------------------------
# SMS Configuration
# -----------------------------------------------------------------------------
sms.url=https://2factor.in/API/V1/{key}/SMS/{mobile}/{otp}
sms.key=${SMS_KEY}

# -----------------------------------------------------------------------------
# Pidge Delivery Integration
# -----------------------------------------------------------------------------
delivery.pidge.url=${DELIVERY_PIDGE_URL}
delivery.pidge.username=${DELIVERY_PIDGE_USERNAME}
delivery.pidge.password=${DELIVERY_PIDGE_PASSWORD}
delivery.pidge.token=${DELIVERY_PIDGE_TOKEN}
delivery.pidge.smart.id=${DELIVERY_PIDGE_SMARTID}

# -----------------------------------------------------------------------------
# Google API Configuration
# -----------------------------------------------------------------------------
google.api.key=${GOOGLE_KEY}

# -----------------------------------------------------------------------------
# Meta/WhatsApp Notification Configuration
# -----------------------------------------------------------------------------
notification.meta.url=https://graph.facebook.com/v20.0
notification.meta.app=3479548262291960
notification.meta.token=${NOTIFICATION_META_TOKEN}
notification.meta.phone=112915418570784
notification.meta.acct=121878920999700
notification.email.address=hyperapps@googlegroups.com

# -----------------------------------------------------------------------------
# OneSignal Push Notification Configuration
# -----------------------------------------------------------------------------
onesignal.api.url=https://api.onesignal.com
onesignal.api.key=${ONE_SIGNAL_KEY}
onesignal.app.id=907a194a-f661-47b3-9199-bdafd091440d
onesignal.partner.api.key=${ONE_SIGNAL_PARTNER_KEY}
onesignal.partner.app.id=0b299a40-44b1-4a74-8618-366734f843c2

# -----------------------------------------------------------------------------
# Backblaze B2 Storage Configuration
# -----------------------------------------------------------------------------
bucket.id=1f0c72d17d83
bucket.name=hyp-bucket
bucket.key=${BUCKET_KEY}
bucket.url=https://f005.backblazeb2.com/file

# -----------------------------------------------------------------------------
# Temporal Workflow Configuration
# -----------------------------------------------------------------------------
temporal.server.host=${TEMPORAL_HOST}
temporal.server.port=${TEMPORAL_PORT}