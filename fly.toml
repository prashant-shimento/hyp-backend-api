app = "hyp-backend"
primary_region = "bom"

[http_service]
internal_port = 9090
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[http_service.concurrency]
type = "requests"
hard_limit = 200
soft_limit = 150

[[http_service.checks]]
grace_period = "500s"
interval = "15s"
method = "GET"
path = "/actuator/health"
timeout = "10s"

[[vm]]
memory = "2gb"
cpu_kind = "shared"
cpus = 1