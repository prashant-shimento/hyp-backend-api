name: VPS Deploy (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
      port:
        description: "Host port to expose (e.g. 9090, 9091, 9092)"
        required: true
        type: string
        default: "9090"
      skip_build:
        description: "Skip Docker build (redeploy existing image)"
        required: false
        type: boolean
        default: false

jobs:
  build-and-push:
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive image tag from branch
        id: meta
        run: |
          # Sanitize branch name for Docker tag (replace / with -)
          TAG=$(echo "${GITHUB_REF_NAME}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        env:
          TAG: ${{ steps.meta.outputs.TAG }}
        run: |
          docker build -t hyp-backend-api .
          docker tag hyp-backend-api lognathp/hyp-backend-api:${TAG}
          docker push lognathp/hyp-backend-api:${TAG}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')

    steps:
      - name: Derive deploy identifiers
        id: meta
        run: |
          TAG=$(echo "${GITHUB_REF_NAME}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          CONTAINER_NAME="hyp-backend-${TAG}"
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "CONTAINER_NAME=${CONTAINER_NAME}" >> $GITHUB_OUTPUT

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_VPS_PRIVATE }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.STAGING_VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create secrets env file
        run: |
          cat > .env.deploy << 'HEADER'
          # Auto-generated by GitHub Actions — do not edit manually
          HEADER
          cat >> .env.deploy << EOF
          ENV=${{ inputs.environment }}
          GOOGLE_KEY=${{ secrets.GOOGLE_KEY }}
          APP_DOMAIN=${{ secrets.STAGING_APP_DOMAIN }}
          DELIVERY_PIDGE_PASSWORD=${{ secrets.STAGING_DELIVERY_PIDGE_PASSWORD }}
          DELIVERY_PIDGE_SMARTID=${{ secrets.STAGING_DELIVERY_PIDGE_SMARTID }}
          DELIVERY_PIDGE_TOKEN=${{ secrets.STAGING_DELIVERY_PIDGE_TOKEN }}
          DELIVERY_PIDGE_URL=${{ secrets.STAGING_DELIVERY_PIDGE_URL }}
          DELIVERY_PIDGE_USERNAME=${{ secrets.STAGING_DELIVERY_PIDGE_USERNAME }}
          MONGODB_CLUSTER=${{ secrets.STAGING_MONGODB_CLUSTER }}
          MONGODB_DATABASE=${{ secrets.STAGING_MONGODB_DATABASE }}
          MONGODB_PASSWORD=${{ secrets.STAGING_MONGODB_PASSWORD }}
          MONGODB_USERNAME=${{ secrets.STAGING_MONGODB_USERNAME }}
          POS_PETPOOJA_KEY=${{ secrets.STAGING_POS_PETPOOJA_KEY }}
          POS_PETPOOJA_SECRET=${{ secrets.STAGING_POS_PETPOOJA_SECRET }}
          POS_PETPOOJA_TOKEN=${{ secrets.STAGING_POS_PETPOOJA_TOKEN }}
          POS_PETPOOJA_URL=${{ secrets.STAGING_POS_PETPOOJA_URL }}
          RAZORPAY_KEY=${{ secrets.STAGING_RAZORPAY_KEY }}
          RAZORPAY_SECRET=${{ secrets.STAGING_RAZORPAY_SECRET }}
          SMS_KEY=${{ secrets.STAGING_SMS_KEY }}
          CHAT_IO_URL=${{ secrets.CHAT_IO_URL }}
          FACEBOOK_ACCESS_TOKEN=${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_API_URL=${{ secrets.FACEBOOK_GRAPH_API_URL }}
          APP_SECRET_KEY=${{ secrets.APP_SECRET_KEY }}
          NOTIFICATION_META_TOKEN=${{ secrets.NOTIFICATION_META_TOKEN }}
          MAIL_APP_PASSWORD=${{ secrets.MAIL_APP_PASSWORD }}
          BUCKET_KEY=${{ secrets.BUCKET_KEY }}
          REDIS_HOST=${{ secrets.STAGING_REDIS_HOST }}
          REDIS_PORT=${{ secrets.STAGING_REDIS_PORT }}
          REDIS_PASSWORD=${{ secrets.STAGING_REDIS_PASSWORD }}
          ONE_SIGNAL_KEY=${{ secrets.ONE_SIGNAL_KEY }}
          ONE_SIGNAL_PARTNER_KEY=${{ secrets.ONE_SIGNAL_PARTNER_KEY }}
          TEMPORAL_HOST=${{ secrets.STAGING_TEMPORAL_HOST }}
          TEMPORAL_PORT=${{ secrets.STAGING_TEMPORAL_PORT }}
          PORTER_RIDER_LOCATION_API_URL=https://porter.in/api/public/orders/order_details?order_id={orderId}&customer_uuid={customerUuid}
          EOF

      - name: Copy secrets to VPS
        env:
          VPS_HOST: ${{ secrets.STAGING_VPS_HOST }}
          VPS_USER: ${{ secrets.STAGING_VPS_USER }}
          CONTAINER_NAME: ${{ steps.meta.outputs.CONTAINER_NAME }}
        run: |
          ssh $VPS_USER@$VPS_HOST "mkdir -p /home/hyp-backend"
          scp .env.deploy $VPS_USER@$VPS_HOST:/home/hyp-backend/.env.${CONTAINER_NAME}
          ssh $VPS_USER@$VPS_HOST "chmod 600 /home/hyp-backend/.env.${CONTAINER_NAME}"

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.STAGING_VPS_HOST }}
          VPS_USER: ${{ secrets.STAGING_VPS_USER }}
          CONTAINER_NAME: ${{ steps.meta.outputs.CONTAINER_NAME }}
          IMAGE_TAG: ${{ steps.meta.outputs.TAG }}
          HOST_PORT: ${{ inputs.port }}
        run: |
          ssh $VPS_USER@$VPS_HOST "bash -s" << EOF
            set -e
            CONTAINER_NAME="${CONTAINER_NAME}"
            IMAGE="lognathp/hyp-backend-api:${IMAGE_TAG}"
            ENV_FILE="/home/hyp-backend/.env.${CONTAINER_NAME}"
            HOST_PORT="${HOST_PORT}"

            echo "==> Deploying \${CONTAINER_NAME} on port \${HOST_PORT}..."

            # Check if the requested port is already in use by another container
            EXISTING=$(docker ps --format '{{.Names}} {{.Ports}}' | grep "0.0.0.0:\${HOST_PORT}->" | awk '{print \$1}' || true)
            if [ -n "\${EXISTING}" ] && [ "\${EXISTING}" != "\${CONTAINER_NAME}" ]; then
                echo "ERROR: Port \${HOST_PORT} is already in use by container '\${EXISTING}'"
                echo "Pick a different port or stop that container first."
                rm -f "\${ENV_FILE}"
                exit 1
            fi

            echo "==> Ensuring logs directory exists..."
            mkdir -p /home/logs

            echo "==> Saving logs from current container..."
            if docker ps -a --format '{{.Names}}' | grep -q "^\${CONTAINER_NAME}\$"; then
                docker logs "\${CONTAINER_NAME}" > "/home/logs/\${CONTAINER_NAME}-\$(date +%Y%m%d%H%M%S).log" 2>&1 || true
                echo "==> Stopping and removing old container..."
                docker stop "\${CONTAINER_NAME}" || true
                docker rm "\${CONTAINER_NAME}" || true
            fi

            echo "==> Pulling latest image..."
            docker pull "\${IMAGE}"

            echo "==> Starting new container on port \${HOST_PORT}..."
            docker run -d \
              --name "\${CONTAINER_NAME}" \
              --restart=always \
              -p "\${HOST_PORT}":9090 \
              --env-file "\${ENV_FILE}" \
              "\${IMAGE}"

            echo "==> Removing secrets file from disk..."
            rm -f "\${ENV_FILE}"

            echo "==> Verifying container is running..."
            sleep 5
            if docker ps --format '{{.Names}}' | grep -q "^\${CONTAINER_NAME}\$"; then
                echo "Deployment successful"
                docker ps --filter "name=\${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            else
                echo "Container failed to start. Logs:"
                docker logs "\${CONTAINER_NAME}" 2>&1 | tail -50
                exit 1
            fi
          EOF
