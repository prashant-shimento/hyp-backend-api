name: Deploy to Staging and Production

on:
  push:
    branches:
      - staging
      - prod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'liberica'
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and tag Docker image
        run: |
          docker build -t hyp-backend-api .
          if [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            docker tag hyp-backend-api ${{ secrets.DOCKER_USERNAME }}/hyp-backend-api:staging
          elif [ "${{ github.ref }}" == "refs/heads/prod" ]; then
            docker tag hyp-backend-api ${{ secrets.DOCKER_USERNAME }}/hyp-backend-api:production
          fi

      - name: Push Docker image
        run: |
          if [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            docker push ${{ secrets.DOCKER_USERNAME }}/hyp-backend-api:staging
          elif [ "${{ github.ref }}" == "refs/heads/prod" ]; then
            docker push ${{ secrets.DOCKER_USERNAME }}/hyp-backend-api:production
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Deploy to VPS
        env:
          # Staging Environment Variables
          STAGING_MONGODB_DATABASE: ${{ secrets.STAGING_MONGODB_DATABASE }}
          STAGING_MONGODB_USERNAME: ${{ secrets.STAGING_MONGODB_USERNAME }}
          STAGING_MONGODB_PASSWORD: ${{ secrets.STAGING_MONGODB_PASSWORD }}
          STAGING_MONGODB_CLUSTER: ${{ secrets.STAGING_MONGODB_CLUSTER }}
          STAGING_APP_DOMAIN: ${{ secrets.STAGING_APP_DOMAIN }}
          STAGING_POS_PETPOOJA_URL: ${{ secrets.STAGING_POS_PETPOOJA_URL }}
          STAGING_POS_PETPOOJA_TOKEN: ${{ secrets.STAGING_POS_PETPOOJA_TOKEN }}
          STAGING_POS_PETPOOJA_SECRET: ${{ secrets.STAGING_POS_PETPOOJA_SECRET }}
          STAGING_POS_PETPOOJA_KEY: ${{ secrets.STAGING_POS_PETPOOJA_KEY }}
          STAGING_SMS_KEY: ${{ secrets.STAGING_SMS_KEY }}
          STAGING_RAZORPAY_KEY: ${{ secrets.STAGING_RAZORPAY_KEY }}
          STAGING_RAZORPAY_SECRET: ${{ secrets.STAGING_RAZORPAY_SECRET }}
          STAGING_DELIVERY_PIDGE_URL: ${{ secrets.STAGING_DELIVERY_PIDGE_URL }}
          STAGING_DELIVERY_PIDGE_USERNAME: ${{ secrets.STAGING_DELIVERY_PIDGE_USERNAME }}
          STAGING_DELIVERY_PIDGE_PASSWORD: ${{ secrets.STAGING_DELIVERY_PIDGE_PASSWORD }}
          STAGING_DELIVERY_PIDGE_TOKEN: ${{ secrets.STAGING_DELIVERY_PIDGE_TOKEN }}
          STAGING_DELIVERY_PIDGE_SMARTID: ${{ secrets.STAGING_DELIVERY_PIDGE_SMARTID }}
          STAGING_GOOGLE_KEY: ${{ secrets.STAGING_GOOGLE_KEY }}
          
          # Production Environment Variables
          PROD_MONGODB_DATABASE: ${{ secrets.PROD_MONGODB_DATABASE }}
          PROD_MONGODB_USERNAME: ${{ secrets.PROD_MONGODB_USERNAME }}
          PROD_MONGODB_PASSWORD: ${{ secrets.PROD_MONGODB_PASSWORD }}
          PROD_MONGODB_CLUSTER: ${{ secrets.PROD_MONGODB_CLUSTER }}
          PROD_APP_DOMAIN: ${{ secrets.PROD_APP_DOMAIN }}
          PROD_POS_PETPOOJA_URL: ${{ secrets.PROD_POS_PETPOOJA_URL }}
          PROD_POS_PETPOOJA_TOKEN: ${{ secrets.PROD_POS_PETPOOJA_TOKEN }}
          PROD_POS_PETPOOJA_SECRET: ${{ secrets.PROD_POS_PETPOOJA_SECRET }}
          PROD_POS_PETPOOJA_KEY: ${{ secrets.PROD_POS_PETPOOJA_KEY }}
          PROD_SMS_KEY: ${{ secrets.PROD_SMS_KEY }}
          PROD_RAZORPAY_KEY: ${{ secrets.PROD_RAZORPAY_KEY }}
          PROD_RAZORPAY_SECRET: ${{ secrets.PROD_RAZORPAY_SECRET }}
          PROD_DELIVERY_PIDGE_URL: ${{ secrets.PROD_DELIVERY_PIDGE_URL }}
          PROD_DELIVERY_PIDGE_USERNAME: ${{ secrets.PROD_DELIVERY_PIDGE_USERNAME }}
          PROD_DELIVERY_PIDGE_PASSWORD: ${{ secrets.PROD_DELIVERY_PIDGE_PASSWORD }}
          PROD_DELIVERY_PIDGE_TOKEN: ${{ secrets.PROD_DELIVERY_PIDGE_TOKEN }}
          PROD_DELIVERY_PIDGE_SMARTID: ${{ secrets.PROD_DELIVERY_PIDGE_SMARTID }}
          PROD_GOOGLE_KEY: ${{ secrets.PROD_GOOGLE_KEY }}
          
        run: |
          if [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            VPS_HOST=${{ secrets.STAGING_VPS_HOST }}
            VPS_USER=${{ secrets.STAGING_VPS_USER }}
            VPS_PASSWORD=${{ secrets.STAGING_VPS_PASSWORD }}
            DOCKER_TAG=staging
            MONGODB_DATABASE=${{ secrets.STAGING_MONGODB_DATABASE }}
            MONGODB_USERNAME=${{ secrets.STAGING_MONGODB_USERNAME }}
            MONGODB_PASSWORD=${{ secrets.STAGING_MONGODB_PASSWORD }}
            MONGODB_CLUSTER=${{ secrets.STAGING_MONGODB_CLUSTER }}
            APP_DOMAIN=${{ secrets.STAGING_APP_DOMAIN }}
            POS_PETPOOJA_URL=${{ secrets.STAGING_POS_PETPOOJA_URL }}
            POS_PETPOOJA_TOKEN=${{ secrets.STAGING_POS_PETPOOJA_TOKEN }}
            POS_PETPOOJA_SECRET=${{ secrets.STAGING_POS_PETPOOJA_SECRET }}
            POS_PETPOOJA_KEY=${{ secrets.STAGING_POS_PETPOOJA_KEY }}
            SMS_KEY=${{ secrets.STAGING_SMS_KEY }}
            RAZORPAY_KEY=${{ secrets.STAGING_RAZORPAY_KEY }}
            RAZORPAY_SECRET=${{ secrets.STAGING_RAZORPAY_SECRET }}
            DELIVERY_PIDGE_URL=${{ secrets.STAGING_DELIVERY_PIDGE_URL }}
            DELIVERY_PIDGE_USERNAME=${{ secrets.STAGING_DELIVERY_PIDGE_USERNAME }}
            DELIVERY_PIDGE_PASSWORD=${{ secrets.STAGING_DELIVERY_PIDGE_PASSWORD }}
            DELIVERY_PIDGE_TOKEN=${{ secrets.STAGING_DELIVERY_PIDGE_TOKEN }}
            DELIVERY_PIDGE_SMARTID=${{ secrets.STAGING_DELIVERY_PIDGE_SMARTID }}
            GOOGLE_KEY=${{ secrets.STAGING_GOOGLE_KEY }}
          elif [ "${{ github.ref }}" == "refs/heads/prod" ]; then
            VPS_HOST=${{ secrets.PROD_VPS_HOST }}
            VPS_USER=${{ secrets.PROD_VPS_USER }}
            VPS_PASSWORD=${{ secrets.PROD_VPS_PASSWORD }}
            DOCKER_TAG=production
            MONGODB_DATABASE=${{ secrets.PROD_MONGODB_DATABASE }}
            MONGODB_USERNAME=${{ secrets.PROD_MONGODB_USERNAME }}
            MONGODB_PASSWORD=${{ secrets.PROD_MONGODB_PASSWORD }}
            MONGODB_CLUSTER=${{ secrets.PROD_MONGODB_CLUSTER }}
            APP_DOMAIN=${{ secrets.PROD_APP_DOMAIN }}
            POS_PETPOOJA_URL=${{ secrets.PROD_POS_PETPOOJA_URL }}
            POS_PETPOOJA_TOKEN=${{ secrets.PROD_POS_PETPOOJA_TOKEN }}
            POS_PETPOOJA_SECRET=${{ secrets.PROD_POS_PETPOOJA_SECRET }}
            POS_PETPOOJA_KEY=${{ secrets.PROD_POS_PETPOOJA_KEY }}
            SMS_KEY=${{ secrets.PROD_SMS_KEY }}
            RAZORPAY_KEY=${{ secrets.PROD_RAZORPAY_KEY }}
            RAZORPAY_SECRET=${{ secrets.PROD_RAZORPAY_SECRET }}
            DELIVERY_PIDGE_URL=${{ secrets.PROD_DELIVERY_PIDGE_URL }}
            DELIVERY_PIDGE_USERNAME=${{ secrets.PROD_DELIVERY_PIDGE_USERNAME }}
            DELIVERY_PIDGE_PASSWORD=${{ secrets.PROD_DELIVERY_PIDGE_PASSWORD }}
            DELIVERY_PIDGE_TOKEN=${{ secrets.PROD_DELIVERY_PIDGE_TOKEN }}
            DELIVERY_PIDGE_SMARTID=${{ secrets.PROD_DELIVERY_PIDGE_SMARTID }}
            GOOGLE_KEY=${{ secrets.PROD_GOOGLE_KEY }}
          fi

          # SSH with password
          sshpass -p $VPS_PASSWORD ssh -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << EOF
            docker stop \$(docker ps -q --filter ancestor=${{ secrets.DOCKER_USERNAME }}/hyp-backend-api:$DOCKER_TAG)
            docker pull ${{ secrets.DOCKER_USERNAME }}/hyp-backend-api:$DOCKER_TAG
            docker run -d --name hyp-backend-api -p 9090:9090 \
              --env MONGODB_DATABASE=$MONGODB_DATABASE \
              --env MONGODB_USERNAME=$MONGODB_USERNAME \
              --env MONGODB_PASSWORD=$MONGODB_PASSWORD \
              --env MONGODB_CLUSTER=$MONGODB_CLUSTER \
              --env APP_DOMAIN=$APP_DOMAIN \
              --env POS_PETPOOJA_URL=$POS_PETPOOJA_URL \
              --env POS_PETPOOJA_TOKEN=$POS_PETPOOJA_TOKEN \
              --env POS_PETPOOJA_SECRET=$POS_PETPOOJA_SECRET \
              --env POS_PETPOOJA_KEY=$POS_PETPOOJA_KEY \
              --env SMS_KEY=$SMS_KEY \
              --env RAZORPAY_KEY=$RAZORPAY_KEY \
              --env RAZORPAY_SECRET=$RAZORPAY_SECRET \
              --env DELIVERY_PIDGE_URL=$DELIVERY_PIDGE_URL \
              --env DELIVERY_PIDGE_USERNAME=$DELIVERY_PIDGE_USERNAME \
              --env DELIVERY_PIDGE_PASSWORD=$DELIVERY_PIDGE_PASSWORD \
              --env DELIVERY_PIDGE_TOKEN=$DELIVERY_PIDGE_TOKEN \
              --env DELIVERY_PIDGE_SMARTID=$DELIVERY_PIDGE_SMARTID \
              --env GOOGLE_KEY=$GOOGLE_KEY \
              ${{ secrets.DOCKER_USERNAME }}/hyp-backend-api:$DOCKER_TAG
          EOF
