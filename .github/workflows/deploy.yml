name: CI/CD Production Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy or rollback to (e.g. v1.2.1)"
        required: true

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        distribution: 'liberica'
        java-version: '17'

    - name: Build with Maven
      run: mvn clean install -DskipTests
      env:
        ENV: production
        GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
        APP_DOMAIN: ${{ secrets.PRODUCTION_APP_DOMAIN }}
        DELIVERY_PIDGE_PASSWORD: ${{ secrets.PRODUCTION_DELIVERY_PIDGE_PASSWORD }}
        DELIVERY_PIDGE_SMARTID: ${{ secrets.PRODUCTION_DELIVERY_PIDGE_SMARTID }}
        DELIVERY_PIDGE_TOKEN: ${{ secrets.PRODUCTION_DELIVERY_PIDGE_TOKEN }}
        DELIVERY_PIDGE_URL: ${{ secrets.PRODUCTION_DELIVERY_PIDGE_URL }}
        DELIVERY_PIDGE_USERNAME: ${{ secrets.PRODUCTION_DELIVERY_PIDGE_USERNAME }}
        MONGODB_CLUSTER: ${{ secrets.PRODUCTION_MONGODB_CLUSTER }}
        MONGODB_DATABASE: ${{ secrets.PRODUCTION_MONGODB_DATABASE }}
        MONGODB_PASSWORD: ${{ secrets.PRODUCTION_MONGODB_PASSWORD }}
        MONGODB_USERNAME: ${{ secrets.PRODUCTION_MONGODB_USERNAME }}
        POS_PETPOOJA_KEY: ${{ secrets.PRODUCTION_POS_PETPOOJA_KEY }}
        POS_PETPOOJA_SECRET: ${{ secrets.PRODUCTION_POS_PETPOOJA_SECRET }}
        POS_PETPOOJA_TOKEN: ${{ secrets.PRODUCTION_POS_PETPOOJA_TOKEN }}
        POS_PETPOOJA_URL: ${{ secrets.PRODUCTION_POS_PETPOOJA_URL }}
        RAZORPAY_KEY: ${{ secrets.PRODUCTION_RAZORPAY_KEY }}
        RAZORPAY_SECRET: ${{ secrets.PRODUCTION_RAZORPAY_SECRET }}
        SMS_KEY: ${{ secrets.PRODUCTION_SMS_KEY }}
        CHAT_IO_URL: ${{ secrets.CHAT_IO_URL }}
        FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        FACEBOOK_GRAPH_API_URL: ${{ secrets.FACEBOOK_GRAPH_API_URL }}
        APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        NOTIFICATION_META_TOKEN: ${{ secrets.NOTIFICATION_META_TOKEN }}
        MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
        BUCKET_KEY: ${{ secrets.BUCKET_KEY }}
        REDIS_HOST: ${{ secrets.PRODUCTION_REDIS_HOST }}
        REDIS_PORT: ${{ secrets.PRODUCTION_REDIS_PORT }}
        REDIS_PASSWORD: ${{ secrets.PRODUCTION_REDIS_PASSWORD }}
        ONE_SIGNAL_KEY: ${{ secrets.ONE_SIGNAL_KEY }}
        ONE_SIGNAL_PARTNER_KEY: ${{ secrets.ONE_SIGNAL_PARTNER_KEY }}
        TEMPORAL_HOST: ${{ secrets.PRODUCTION_TEMPORAL_HOST }}
        TEMPORAL_PORT: ${{ secrets.PRODUCTION_TEMPORAL_PORT }}
        PORTER_RIDER_LOCATION_API_URL: https://porter.in/api/public/orders/order_details?order_id={orderId}&customer_uuid={customerUuid}
        DELIVERY_ADLOGGS_URL: ${{ secrets.PRODUCTION_DELIVERY_ADLOGGS_URL }}
        DELIVERY_ADLOGGS_API_KEY: ${{ secrets.PRODUCTION_DELIVERY_ADLOGGS_API_KEY }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
    - name: Create .env file
      run: |
        echo "GOOGLE_KEY=${{ secrets.GOOGLE_KEY }}" >> .env
        echo "APP_DOMAIN=${{ secrets.PRODUCTION_APP_DOMAIN }}" >> .env
        echo "DELIVERY_PIDGE_PASSWORD=${{ secrets.PRODUCTION_DELIVERY_PIDGE_PASSWORD }}" >> .env
        echo "DELIVERY_PIDGE_SMARTID=${{ secrets.PRODUCTION_DELIVERY_PIDGE_SMARTID }}" >> .env
        echo "DELIVERY_PIDGE_TOKEN=${{ secrets.PRODUCTION_DELIVERY_PIDGE_TOKEN }}" >> .env
        echo "DELIVERY_PIDGE_URL=${{ secrets.PRODUCTION_DELIVERY_PIDGE_URL }}" >> .env
        echo "DELIVERY_PIDGE_USERNAME=${{ secrets.PRODUCTION_DELIVERY_PIDGE_USERNAME }}" >> .env
        echo "MONGODB_CLUSTER=${{ secrets.PRODUCTION_MONGODB_CLUSTER }}" >> .env
        echo "MONGODB_DATABASE=${{ secrets.PRODUCTION_MONGODB_DATABASE }}" >> .env
        echo "MONGODB_PASSWORD=${{ secrets.PRODUCTION_MONGODB_PASSWORD }}" >> .env
        echo "MONGODB_USERNAME=${{ secrets.PRODUCTION_MONGODB_USERNAME }}" >> .env
        echo "POS_PETPOOJA_KEY=${{ secrets.PRODUCTION_POS_PETPOOJA_KEY }}" >> .env
        echo "POS_PETPOOJA_SECRET=${{ secrets.PRODUCTION_POS_PETPOOJA_SECRET }}" >> .env
        echo "POS_PETPOOJA_TOKEN=${{ secrets.PRODUCTION_POS_PETPOOJA_TOKEN }}" >> .env
        echo "POS_PETPOOJA_URL=${{ secrets.PRODUCTION_POS_PETPOOJA_URL }}" >> .env
        echo "RAZORPAY_KEY=${{ secrets.PRODUCTION_RAZORPAY_KEY }}" >> .env
        echo "RAZORPAY_SECRET=${{ secrets.PRODUCTION_RAZORPAY_SECRET }}" >> .env
        echo "SMS_KEY=${{ secrets.PRODUCTION_SMS_KEY }}" >> .env
        echo "CHAT_IO_URL=${{ secrets.CHAT_IO_URL }}" >> .env
        echo "FACEBOOK_ACCESS_TOKEN=${{ secrets.FACEBOOK_ACCESS_TOKEN }}" >> .env
        echo "FACEBOOK_GRAPH_API_URL=${{ secrets.FACEBOOK_GRAPH_API_URL }}" >> .env
        echo "APP_SECRET_KEY=${{ secrets.APP_SECRET_KEY }}" >> .env
        echo "NOTIFICATION_META_TOKEN=${{ secrets.NOTIFICATION_META_TOKEN }}" >> .env
        echo "MAIL_APP_PASSWORD=${{ secrets.MAIL_APP_PASSWORD }}" >> .env
        echo "BUCKET_KEY=${{ secrets.BUCKET_KEY }}" >> .env
        echo "REDIS_HOST=${{ secrets.PRODUCTION_REDIS_HOST }}" >> .env
        echo "REDIS_PORT=${{ secrets.PRODUCTION_REDIS_PORT }}" >> .env
        echo "REDIS_PASSWORD=${{ secrets.PRODUCTION_REDIS_PASSWORD }}" >> .env
        echo "ONE_SIGNAL_KEY=${{ secrets.ONE_SIGNAL_KEY }}" >> .env
        echo "ONE_SIGNAL_PARTNER_KEY=${{ secrets.ONE_SIGNAL_PARTNER_KEY }}" >> .env
        echo "TEMPORAL_HOST=${{ secrets.PRODUCTION_TEMPORAL_HOST }}" >> .env
        echo "TEMPORAL_PORT=${{ secrets.PRODUCTION_TEMPORAL_PORT }}" >> .env
        echo "PORTER_RIDER_LOCATION_API_URL=https://porter.in/api/public/orders/order_details?order_id={orderId}&customer_uuid={customerUuid}" >> .env
        echo "DELIVERY_ADLOGGS_URL=${{ secrets.PRODUCTION_DELIVERY_ADLOGGS_URL }}" >> .env
        echo "DELIVERY_ADLOGGS_API_KEY=${{ secrets.PRODUCTION_DELIVERY_ADLOGGS_API_KEY }}" >> .env
        echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        docker build -t hyp-backend-api .
        docker tag hyp-backend-api lognathp/hyp-backend-api:${{ env.VERSION }}
        docker tag hyp-backend-api lognathp/hyp-backend-api:production
        docker push lognathp/hyp-backend-api:${{ env.VERSION }}
        docker push lognathp/hyp-backend-api:production

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')

    steps:
    - name: Determine version to deploy
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3

    - name: Configure kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Deploy to Kubernetes
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
      run: |
        kubectl set image deployment/hyp-backend \
          hyp-backend=lognathp/hyp-backend-api:${VERSION}
        kubectl rollout status deployment/hyp-backend --timeout=120s
        echo "Deployed version: ${VERSION}"