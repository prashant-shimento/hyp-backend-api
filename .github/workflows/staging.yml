name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        distribution: 'liberica'
        java-version: '17'

    - name: Build with Maven
      run: mvn clean install
      env:
        GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
        STAGING_APP_DOMAIN: ${{ secrets.STAGING_APP_DOMAIN }}
        STAGING_DELIVERY_PIDGE_PASSWORD: ${{ secrets.STAGING_DELIVERY_PIDGE_PASSWORD }}
        STAGING_DELIVERY_PIDGE_SMARTID: ${{ secrets.STAGING_DELIVERY_PIDGE_SMARTID }}
        STAGING_DELIVERY_PIDGE_TOKEN: ${{ secrets.STAGING_DELIVERY_PIDGE_TOKEN }}
        STAGING_DELIVERY_PIDGE_URL: ${{ secrets.STAGING_DELIVERY_PIDGE_URL }}
        STAGING_DELIVERY_PIDGE_USERNAME: ${{ secrets.STAGING_DELIVERY_PIDGE_USERNAME }}
        STAGING_MONGODB_CLUSTER: ${{ secrets.STAGING_MONGODB_CLUSTER }}
        STAGING_MONGODB_DATABASE: ${{ secrets.STAGING_MONGODB_DATABASE }}
        STAGING_MONGODB_PASSWORD: ${{ secrets.STAGING_MONGODB_PASSWORD }}
        STAGING_MONGODB_USERNAME: ${{ secrets.STAGING_MONGODB_USERNAME }}
        STAGING_POS_PETPOOJA_KEY: ${{ secrets.STAGING_POS_PETPOOJA_KEY }}
        STAGING_POS_PETPOOJA_SECRET: ${{ secrets.STAGING_POS_PETPOOJA_SECRET }}
        STAGING_POS_PETPOOJA_TOKEN: ${{ secrets.STAGING_POS_PETPOOJA_TOKEN }}
        STAGING_POS_PETPOOJA_URL: ${{ secrets.STAGING_POS_PETPOOJA_URL }}
        STAGING_RAZORPAY_KEY: ${{ secrets.STAGING_RAZORPAY_KEY }}
        STAGING_RAZORPAY_SECRET: ${{ secrets.STAGING_RAZORPAY_SECRET }}
        STAGING_SMS_KEY: ${{ secrets.STAGING_SMS_KEY }}
        CHAT_IO_URL: ${{ secrets.CHAT_IO_URL }}
        FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        FACEBOOK_GRAPH_API_URL: ${{ secrets.FACEBOOK_GRAPH_API_URL }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        docker build -t hyp-backend-api .
        docker tag hyp-backend-api lognathp/hyp-backend-api:staging
        docker push lognathp/hyp-backend-api:staging

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Deploy to VPS
      env:
        SSH_PRIVATE_KEY: ${{ secrets.STAGING_VPS_SSH }}
        VPS_HOST: ${{ secrets.STAGING_VPS_HOST }}
        VPS_USER: ${{ secrets.STAGING_VPS_USER }}
      run: |
        ssh -o StrictHostKeyChecking=no -i "${{ secrets.SSH_PRIVATE_KEY }}" ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          docker stop $(docker ps -q --filter ancestor=lognathp/hyp-backend-api:staging)
          docker rm $(docker ps -a -q --filter ancestor=lognathp/hyp-backend-api:staging)
          docker rmi lognathp/hyp-backend-api:staging
          docker pull lognathp/hyp-backend-api:staging
          docker run -p 9090:9090 -d lognathp/hyp-backend-api:staging
        EOF
