name: CI/CD Staging Pipeline

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        distribution: 'liberica'
        java-version: '17'

    - name: Build with Maven
      run: mvn clean install -DskipTests
      env:
        GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
        APP_DOMAIN: ${{ secrets.STAGING_APP_DOMAIN }}
        DELIVERY_PIDGE_PASSWORD: ${{ secrets.STAGING_DELIVERY_PIDGE_PASSWORD }}
        DELIVERY_PIDGE_SMARTID: ${{ secrets.STAGING_DELIVERY_PIDGE_SMARTID }}
        DELIVERY_PIDGE_TOKEN: ${{ secrets.STAGING_DELIVERY_PIDGE_TOKEN }}
        DELIVERY_PIDGE_URL: ${{ secrets.STAGING_DELIVERY_PIDGE_URL }}
        DELIVERY_PIDGE_USERNAME: ${{ secrets.STAGING_DELIVERY_PIDGE_USERNAME }}
        MONGODB_CLUSTER: ${{ secrets.STAGING_MONGODB_CLUSTER }}
        MONGODB_DATABASE: ${{ secrets.STAGING_MONGODB_DATABASE }}
        MONGODB_PASSWORD: ${{ secrets.STAGING_MONGODB_PASSWORD }}
        MONGODB_USERNAME: ${{ secrets.STAGING_MONGODB_USERNAME }}
        POS_PETPOOJA_KEY: ${{ secrets.STAGING_POS_PETPOOJA_KEY }}
        POS_PETPOOJA_SECRET: ${{ secrets.STAGING_POS_PETPOOJA_SECRET }}
        POS_PETPOOJA_TOKEN: ${{ secrets.STAGING_POS_PETPOOJA_TOKEN }}
        POS_PETPOOJA_URL: ${{ secrets.STAGING_POS_PETPOOJA_URL }}
        RAZORPAY_KEY: ${{ secrets.STAGING_RAZORPAY_KEY }}
        RAZORPAY_SECRET: ${{ secrets.STAGING_RAZORPAY_SECRET }}
        SMS_KEY: ${{ secrets.STAGING_SMS_KEY }}
        CHAT_IO_URL: ${{ secrets.CHAT_IO_URL }}
        FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        FACEBOOK_GRAPH_API_URL: ${{ secrets.FACEBOOK_GRAPH_API_URL }}
        APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        NOTIFICATION_META_TOKEN: ${{ secrets.NOTIFICATION_META_TOKEN }}
        MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
        BUCKET_KEY: ${{ secrets.BUCKET_KEY }}
        REDIS_HOST: ${{ secrets.STAGING_REDIS_HOST }}
        REDIS_PORT: ${{ secrets.STAGING_REDIS_PORT }}
        REDIS_PASSWORD: ${{ secrets.STAGING_REDIS_PASSWORD }}

    - name: Create .env file
      run: |
        echo "GOOGLE_KEY=${{ secrets.GOOGLE_KEY }}" >> .env
        echo "APP_DOMAIN=${{ secrets.STAGING_APP_DOMAIN }}" >> .env
        echo "DELIVERY_PIDGE_PASSWORD=${{ secrets.STAGING_DELIVERY_PIDGE_PASSWORD }}" >> .env
        echo "DELIVERY_PIDGE_SMARTID=${{ secrets.STAGING_DELIVERY_PIDGE_SMARTID }}" >> .env
        echo "DELIVERY_PIDGE_TOKEN=${{ secrets.STAGING_DELIVERY_PIDGE_TOKEN }}" >> .env
        echo "DELIVERY_PIDGE_URL=${{ secrets.STAGING_DELIVERY_PIDGE_URL }}" >> .env
        echo "DELIVERY_PIDGE_USERNAME=${{ secrets.STAGING_DELIVERY_PIDGE_USERNAME }}" >> .env
        echo "MONGODB_CLUSTER=${{ secrets.STAGING_MONGODB_CLUSTER }}" >> .env
        echo "MONGODB_DATABASE=${{ secrets.STAGING_MONGODB_DATABASE }}" >> .env
        echo "MONGODB_PASSWORD=${{ secrets.STAGING_MONGODB_PASSWORD }}" >> .env
        echo "MONGODB_USERNAME=${{ secrets.STAGING_MONGODB_USERNAME }}" >> .env
        echo "POS_PETPOOJA_KEY=${{ secrets.STAGING_POS_PETPOOJA_KEY }}" >> .env
        echo "POS_PETPOOJA_SECRET=${{ secrets.STAGING_POS_PETPOOJA_SECRET }}" >> .env
        echo "POS_PETPOOJA_TOKEN=${{ secrets.STAGING_POS_PETPOOJA_TOKEN }}" >> .env
        echo "POS_PETPOOJA_URL=${{ secrets.STAGING_POS_PETPOOJA_URL }}" >> .env
        echo "RAZORPAY_KEY=${{ secrets.STAGING_RAZORPAY_KEY }}" >> .env
        echo "RAZORPAY_SECRET=${{ secrets.STAGING_RAZORPAY_SECRET }}" >> .env
        echo "SMS_KEY=${{ secrets.STAGING_SMS_KEY }}" >> .env
        echo "CHAT_IO_URL=${{ secrets.CHAT_IO_URL }}" >> .env
        echo "FACEBOOK_ACCESS_TOKEN=${{ secrets.FACEBOOK_ACCESS_TOKEN }}" >> .env
        echo "FACEBOOK_GRAPH_API_URL=${{ secrets.FACEBOOK_GRAPH_API_URL }}" >> .env
        echo "APP_SECRET_KEY=${{ secrets.APP_SECRET_KEY }}" >> .env
        echo "NOTIFICATION_META_TOKEN=${{ secrets.NOTIFICATION_META_TOKEN }}" >> .env
        echo "MAIL_APP_PASSWORD=${{ secrets.MAIL_APP_PASSWORD }}" >> .env
        echo "BUCKET_KEY=${{ secrets.BUCKET_KEY }}" >> .env
        echo "REDIS_HOST=${{ secrets.STAGING_REDIS_HOST }}" >> .env
        echo "REDIS_PORT=${{ secrets.STAGING_REDIS_PORT }}" >> .env
        echo "REDIS_PASSWORD=${{ secrets.STAGING_REDIS_PASSWORD }}" >> .env


    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        docker build -t hyp-backend-api .
        docker tag hyp-backend-api lognathp/hyp-backend-api:staging
        docker push lognathp/hyp-backend-api:staging

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Deploy to VPS
      env:
        VPS_PRIVATE: ${{ secrets.STAGING_VPS_PRIVATE }}
        VPS_HOST: ${{ secrets.STAGING_VPS_HOST }}
        VPS_USER: ${{ secrets.STAGING_VPS_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.STAGING_VPS_PRIVATE }}" | tr -d '\r' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.STAGING_VPS_USER }}@${{ secrets.STAGING_VPS_HOST }} << 'EOF'
          CONTAINER_ID=$(docker ps -q --filter ancestor=lognathp/hyp-backend-api:staging)
          if [ ! -z '$CONTAINER_ID' ]; then
          	docker stop $CONTAINER_ID
          	docker logs $CONTAINER_ID > /home/logs/$CONTAINER_ID-$(date +"%d%m%Y%H%M%S").log
          	docker rm $CONTAINER_ID
          fi
          docker rmi lognathp/hyp-backend-api:staging
          docker pull lognathp/hyp-backend-api:staging
          docker run -p 9090:9090 -d lognathp/hyp-backend-api:staging
        EOF
