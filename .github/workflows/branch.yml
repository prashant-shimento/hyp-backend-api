name: CI/CD Security Branch

on:
  push:
    branches:
      - security-implementation

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'liberica'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -f Dockerfile.fly -t hyp-backend-api .
          docker tag hyp-backend-api lognathp/hyp-backend-api:security
          docker push lognathp/hyp-backend-api:security

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Fly Registry
        run: echo ${{ secrets.FLY_TOKEN }} | docker login registry.fly.io -u x --password-stdin

      - name: Pull from Docker Hub and push to Fly Registry
        run: |
          docker pull lognathp/hyp-backend-api:security
          docker tag lognathp/hyp-backend-api:security registry.fly.io/hyp-backend:security
          docker push registry.fly.io/hyp-backend:security

      - name: Deploy to Fly
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Fly Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN }}
        run: |
          flyctl deploy \
            --app hyp-backend \
            --image registry.fly.io/hyp-backend:security
