name: Fly Deploy Manual

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"
      tag:
        description: "Docker image tag"
        required: true
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login Fly Registry
        run: echo ${{ secrets.FLY_TOKEN }} | docker login registry.fly.io -u x --password-stdin

      - name: Build Docker Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f Dockerfile.fly \
            -t lognathp/hyp-backend-api:${{ github.event.inputs.tag }} \
            -t registry.fly.io/hyp-backend:${{ github.event.inputs.tag }} \
            --push .

      - name: Push to Docker Hub
        run: |
          docker push lognathp/hyp-backend-api:${{ github.event.inputs.tag }}

      - name: Deploy to Fly
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Fly Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN }}
        run: |
          flyctl deploy \
            --app hyp-backend \
            --image registry.fly.io/hyp-backend:${{ github.event.inputs.tag }}